version: '3'
services:
  ggr:
    restart: always
    image: aerokube/ggr
    links:
      - ggr-ui
    ports:
      - "5555:5555"
    volumes:
      - "./:/etc/grid-router:ro"
    command: ["-listen", ":5555"]
  ggr-ui:
    restart: always
    image: aerokube/ggr-ui
    ports:
      - "8888:8888"
    volumes:
      - "./:/etc/grid-router:ro"