# This is an example of deploying moon-monitor microservice.
#
# Assumptions:
# 1) Moon is running in "moon" namespace
# 2) Prometheus is deployed using prometheus-operator
# 3) Prometheus is running in "prometheus" namespace

apiVersion: v1
kind: ServiceAccount
metadata:
  name: moon-monitor
  namespace: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moon-monitor
  namespace: moon
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - resourcequotas
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moon-monitor
  namespace: moon
roleRef:
  kind: Role
  name: moon-monitor
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: moon-monitor
    namespace: prometheus
---
kind: Service
apiVersion: v1
metadata:
  annotations:
   prometheus.io/scrape: "true"
  name: moon-monitor
  namespace: prometheus
  labels:
    app: moon-monitor
spec:
  selector:
    app: moon-monitor
  ports:
    - name: metrics
      port: 8080
---
# This custom resource from prometheus-operator is actually fetching the data
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: moon-monitor
  namespace: prometheus
  labels:
    release: prometheus-operator
    serviceapp: moon-monitor
spec:
  selector:
    matchLabels:
      app: moon-monitor
  endpoints:
    - port: metrics
    - path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
    - prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moon-monitor
  namespace: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moon-monitor
  template:
    metadata:
      labels:
        app: moon-monitor
    spec:
      serviceAccountName: moon-monitor
      containers:
        - name: moon-monitor
          image: aerokube/moon-monitor:1.9.3
          args: ["-namespace", "moon"]
          ports:
            - name: metrics
              containerPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  labels:
    prometheus: prometheus
spec:
  replicas: 2
  serviceAccountName: moon-monitor
  serviceMonitorSelector:
    matchLabels:
      release: prometheus-operator
      serviceapp: moon-monitor
  alerting:
    alertmanagers:
    - namespace: prometheus
      name: alertmanager
      port: metrics